services:
  prometheus:
    image: prom/prometheus:latest
    container_name: libswap-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    depends_on:
      - blackbox-exporter
      - alertmanager

  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    container_name: libswap-blackbox
    ports:
      - "9115:9115"

  alertmanager:
    image: prom/alertmanager:latest
    container_name: libswap-alertmanager
    ports:
      - "9093:9093"