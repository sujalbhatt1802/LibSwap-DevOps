<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- This helps the page display properly on different screen sizes -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LibSwap Notifications</title>

    <!-- Connecting our CSS file -->
    <link rel="stylesheet" href="css/notifications.css">
</head>

<body>

    <!-- Main heading for the notifications page -->
    <header>
        <h1>Notifications</h1>
        <p>Stay updated on library and book-swap activity without checking every section.</p>
        <nav class="site-nav">
            <a href="dashboard.html">Dashboard</a>
            <a href="catalogue.html">Catalogue</a>
            <a href="book-requests.html">Request a Book</a>
            <a href="notifications.html">Notifications</a>
        </nav>
    </header>

    <main>

        <!-- Shown only when the visitor is not logged in yet -->
        <section id="loginSection" class="panel">
            <h2>Sign in to view your notifications</h2>

            <div class="form-row">
                <label for="loginEmail">Email</label>
                <input type="email" id="loginEmail" placeholder="you@deakin.edu.au">
            </div>

            <div class="form-row">
                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword" placeholder="Password">
            </div>

            <button id="loginButton">Sign in</button>

            <p id="loginMessage" class="message"></p>
        </section>

        <!-- Shown once the visitor is logged in -->
        <section id="appSection" class="panel hidden">

            <div class="account-bar">
                <span id="welcomeText"></span>
                <button id="logoutButton" class="secondary-button">Logout</button>
            </div>

            <div class="notifications-toolbar">
                <div class="filter-control">
                    <label for="unreadFilter">Show</label>

                    <select id="unreadFilter">
                        <option value="all">All notifications</option>
                        <option value="unread">Unread only</option>
                    </select>
                </div>

                <span id="unreadBadge" class="unread-badge"></span>

                <button id="markAllButton" class="secondary-button">Mark all as read</button>
            </div>

            <!-- This message can show loading, errors or no results -->
            <p id="message" class="message"></p>

            <!-- JavaScript will add the notification cards inside this section -->
            <section id="notificationList" class="notification-list">
            </section>

        </section>

    </main>

    <!-- Connecting our JavaScript file -->
    <script src="js/notifications.js"></script>

</body>
</html>
